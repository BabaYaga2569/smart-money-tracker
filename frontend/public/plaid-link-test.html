<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Plaid Link Test</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 30px;
    }
    button {
      background: #00ff88;
      color: #000;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    pre {
      background: #222;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      margin-top: 20px;
      max-height: 650px;
      overflow: auto;
    }
    .warning {
      color: #ffcc00;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>Plaid Link Test</h1>
  <p>This page connects a real bank through Plaid production, exchanges the token, and tests transaction sync.</p>

  <button id="connectBtn">Connect Bank + Sync Transactions</button>

  <p class="warning">
    Do not share screenshots showing access_token values. This page hides the token, but still review screenshots carefully.
  </p>

  <pre id="output">Waiting...</pre>

  <script>
    const output = document.getElementById("output");
    const connectBtn = document.getElementById("connectBtn");

    function log(data) {
      output.textContent =
        typeof data === "string" ? data : JSON.stringify(data, null, 2);
    }

    async function createLinkToken() {
      const res = await fetch("/.netlify/functions/plaid-create-link-token", {
        method: "POST",
      });

      const data = await res.json();

      if (!data.ok || !data.link_token) {
        throw new Error("Failed to create link token: " + JSON.stringify(data));
      }

      return data.link_token;
    }

    async function exchangePublicToken(publicToken) {
      const res = await fetch("/.netlify/functions/plaid-exchange-token", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          public_token: publicToken,
        }),
      });

      return await res.json();
    }

    async function syncTransactions(accessToken) {
      const res = await fetch("/.netlify/functions/plaid-sync-transactions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          access_token: accessToken,
        }),
      });

      return await res.json();
    }

    function safeTransactionPreview(transactions) {
      return (transactions || []).slice(0, 20).map((tx) => ({
        transaction_id: tx.transaction_id,
        date: tx.date,
        name: tx.name,
        merchant_name: tx.merchant_name,
        amount: tx.amount,
        pending: tx.pending,
        category: tx.category,
        personal_finance_category: tx.personal_finance_category,
      }));
    }

    connectBtn.addEventListener("click", async () => {
      try {
        connectBtn.disabled = true;
        log("Creating Plaid Link token...");

        const linkToken = await createLinkToken();

        log("Opening Plaid Link...");

        const handler = Plaid.create({
          token: linkToken,
          onSuccess: async function(public_token, metadata) {
            log("Plaid Link success. Exchanging public token...");

            const exchangeResult = await exchangePublicToken(public_token);

            if (!exchangeResult.ok || !exchangeResult.access_token) {
              log({
                ok: false,
                step: "exchangePublicToken",
                exchangeResult,
              });
              connectBtn.disabled = false;
              return;
            }

            log("Token exchange success. Pulling transactions...");

            const syncResult = await syncTransactions(exchangeResult.access_token);

            const safeResult = {
              ok: syncResult.ok,
              plaidEnv: syncResult.plaidEnv,
              item_id: exchangeResult.item_id,
              has_access_token: Boolean(exchangeResult.access_token),
              institution: metadata.institution,
              accounts: metadata.accounts,
              sync_counts: syncResult.counts,
              cursor_received: Boolean(syncResult.cursor),
              transaction_preview_count: Math.min((syncResult.transactions || []).length, 20),
              transaction_preview: safeTransactionPreview(syncResult.transactions),
              error: syncResult.error || null,
              warning: "Access token is intentionally hidden. Preview is capped at 20 transactions."
            };

            log(safeResult);
            connectBtn.disabled = false;
          },
          onExit: function(err, metadata) {
            log({
              exited: true,
              error: err,
              metadata: metadata,
            });
            connectBtn.disabled = false;
          },
          onEvent: function(eventName, metadata) {
            console.log("Plaid event:", eventName, metadata);
          },
        });

        handler.open();
      } catch (err) {
        log({
          ok: false,
          error: err.message,
        });
        connectBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
